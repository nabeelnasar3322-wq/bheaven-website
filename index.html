<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bar Bites · B-Heaven by Barceló</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --cream:#ebebea;
  --cream2:#f2f2f0;
  --teal:#2d6b68;
  --teal-dark:#1b3c3a;
  --text:#1a2b2a;
  --text-light:#6a7a78;
  --gold:#b8905a;
  --white:#ffffff;
}

html,body{
  width:100%;min-height:100vh;
  background:var(--cream);
  font-family:'Montserrat',sans-serif;
  color:var(--text);
  overflow-x:hidden;
}

/* ── DIAMOND GRID BACKGROUND ── */
body::before{
  content:'';
  position:fixed;inset:0;
  background-image:
    repeating-linear-gradient(45deg,rgba(0,0,0,0.045) 0,rgba(0,0,0,0.045) 1px,transparent 0,transparent 50%),
    repeating-linear-gradient(-45deg,rgba(0,0,0,0.045) 0,rgba(0,0,0,0.045) 1px,transparent 0,transparent 50%);
  background-size:42px 42px;
  pointer-events:none;z-index:0;
}

/* ── FLOATING INGREDIENTS ── */
.ingredient{
  position:fixed;pointer-events:none;z-index:1;
  border-radius:50%;
  background:radial-gradient(circle at 35% 35%, rgba(255,255,255,0.6), rgba(200,200,190,0.3));
  box-shadow:0 4px 20px rgba(0,0,0,0.08);
}
.ing-1{width:62px;height:62px;top:12%;left:3%;
  background:radial-gradient(circle at 40% 30%,#e8f5e9,#a5c8a0);
  clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  /* basil leaf */
  clip-path:none;
  border-radius:0 60% 40% 60%;
  transform:rotate(-20deg);
}
.ing-2{width:45px;height:45px;bottom:30%;left:4%;
  background:radial-gradient(circle,#ffd180,#ffab40);
  border-radius:50% 40% 60% 40% / 40% 50% 50% 60%;
  transform:rotate(30deg);
}
.ing-3{width:38px;height:38px;top:20%;right:4%;
  background:radial-gradient(circle at 45% 35%,#ff8a80,#e53935);
  border-radius:50%;
  box-shadow:inset 0 0 0 4px rgba(255,255,255,0.3);
}
.ing-4{width:55px;height:55px;bottom:20%;right:3%;
  background:radial-gradient(circle at 40% 40%,#c8e6c9,#2e7d32);
  border-radius:0 60% 40% 60%;
  transform:rotate(45deg);
}
.ing-5{width:40px;height:40px;top:60%;left:2%;
  background:radial-gradient(circle,#3e2723 40%,#1a0a00);
  border-radius:50%;
  box-shadow:0 2px 12px rgba(0,0,0,0.2);
}
.ing-6{width:50px;height:28px;bottom:12%;left:20%;
  background:linear-gradient(135deg,#fff59d,#f9a825);
  border-radius:60%;
  transform:rotate(-15deg);
}

/* ── NAV ── */
nav{
  position:relative;z-index:10;
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 48px;
  background:rgba(250,250,248,0.92);
  backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(0,0,0,0.07);
}
.nav-logo{font-family:'Montserrat',sans-serif;font-weight:700;font-size:18px;letter-spacing:3px;color:var(--text)}
.nav-logo span{font-weight:300}
.nav-sub{font-size:9px;letter-spacing:2.5px;color:var(--text-light);text-transform:uppercase;display:block;margin-top:2px}
.nav-cta{
  background:var(--teal-dark);color:#fff;
  border:none;padding:10px 24px;
  font-family:'Montserrat',sans-serif;font-size:11px;font-weight:600;
  letter-spacing:2px;text-transform:uppercase;
  border-radius:40px;cursor:pointer;
}

/* ── BANNER / HERO ── */
.hero{
  position:relative;z-index:2;
  width:100%;height:340px;overflow:hidden;
  background:var(--cream2);
}
.hero-img{
  width:100%;height:100%;object-fit:cover;object-position:center 30%;
  mix-blend-mode:multiply;
  opacity:0.82;
}
.hero-overlay{
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(235,235,234,0) 20%,rgba(235,235,234,0.95) 100%);
}
.hero-label{
  position:absolute;top:32px;left:48px;
  font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--teal);
  display:flex;align-items:center;gap:10px;
}
.hero-label::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--teal);display:inline-block}

/* ── SECTION HEADER ── */
.section-head{
  position:relative;z-index:2;
  padding:32px 48px 0;
  display:flex;align-items:flex-start;justify-content:space-between;
}
.section-num{
  font-family:'Cormorant Garamond',serif;
  font-size:120px;font-weight:600;
  color:rgba(0,0,0,0.06);
  line-height:1;
  position:absolute;left:32px;top:8px;
  pointer-events:none;
  user-select:none;
}
.section-title-wrap{padding-left:80px}
.section-badge{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--teal);margin-bottom:6px}
.section-title{
  font-family:'Montserrat',sans-serif;
  font-size:clamp(28px,4vw,48px);
  font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:var(--teal);
  line-height:1;
}
.section-desc{
  font-size:13px;color:var(--text-light);max-width:340px;
  line-height:1.6;margin-top:8px;font-weight:400;
}

/* ── DISH GRID ── */
.dishes-grid{
  position:relative;z-index:2;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:0 32px;
  padding:24px 48px 48px;
  align-items:end;
}
.dish-card{
  cursor:pointer;
  text-align:center;
  transition:transform 0.35s ease;
}
.dish-card:hover{transform:translateY(-8px)}
.dish-card:nth-child(2){transform:translateY(-24px)}
.dish-card:nth-child(2):hover{transform:translateY(-32px)}
.dish-card:nth-child(5){transform:translateY(-16px)}
.dish-card:nth-child(5):hover{transform:translateY(-24px)}

.dish-img-wrap{
  position:relative;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:14px;
}
.dish-img{
  width:min(220px,90%);
  aspect-ratio:1;
  object-fit:contain;
  filter:drop-shadow(0 12px 28px rgba(0,0,0,0.14));
  transition:filter 0.3s;
}
.dish-card:hover .dish-img{
  filter:drop-shadow(0 18px 36px rgba(0,0,0,0.2));
}
.chef-badge{
  position:absolute;top:4px;left:50%;transform:translateX(-50%);
  background:var(--gold);color:#fff;
  font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  padding:5px 14px;border-radius:40px;
  white-space:nowrap;
}
.dish-name{
  font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:var(--text);margin-bottom:6px;
}
.dish-price{
  font-size:14px;font-weight:600;color:var(--teal);
  letter-spacing:0.5px;
}
.dish-price::before{content:'Ð ';font-size:11px}

/* ── POPUP OVERLAY ── */
.overlay{
  position:fixed;inset:0;z-index:100;
  background:rgba(30,50,48,0.55);
  backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;
  transition:opacity 0.3s;
}
.overlay.open{opacity:1;pointer-events:all}

.popup{
  background:var(--cream2);
  border-radius:20px;
  width:min(820px,94vw);
  max-height:90vh;
  overflow:hidden;
  position:relative;
  display:grid;
  grid-template-columns:1fr 1fr;
  box-shadow:0 32px 80px rgba(0,0,0,0.18);
  transform:scale(0.94) translateY(12px);
  transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
}
.overlay.open .popup{transform:scale(1) translateY(0)}

/* diamond grid inside popup */
.popup::before{
  content:'';position:absolute;inset:0;
  background-image:
    repeating-linear-gradient(45deg,rgba(0,0,0,0.04) 0,rgba(0,0,0,0.04) 1px,transparent 0,transparent 50%),
    repeating-linear-gradient(-45deg,rgba(0,0,0,0.04) 0,rgba(0,0,0,0.04) 1px,transparent 0,transparent 50%);
  background-size:42px 42px;
  pointer-events:none;z-index:0;border-radius:20px;
}

.popup-img-side{
  position:relative;z-index:1;
  display:flex;align-items:center;justify-content:center;
  padding:40px 20px 40px 40px;
  background:linear-gradient(135deg,rgba(255,255,255,0.6),rgba(220,230,228,0.3));
}
.popup-img-glow{
  position:absolute;
  width:200px;height:200px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(45,107,104,0.12),transparent 70%);
  pointer-events:none;
}
.popup-dish-img{
  width:100%;max-width:280px;
  object-fit:contain;
  filter:drop-shadow(0 16px 40px rgba(0,0,0,0.18));
  transform:rotate(-6deg);
  transition:transform 0.4s ease;
  position:relative;z-index:2;
}
.overlay.open .popup-dish-img{transform:rotate(-3deg)}

.popup-info{
  position:relative;z-index:1;
  padding:40px 36px 32px 28px;
  display:flex;flex-direction:column;
  justify-content:space-between;
}
.popup-counter{
  font-size:11px;color:var(--text-light);letter-spacing:2px;margin-bottom:4px;
}
.popup-cat{
  font-size:10px;letter-spacing:3px;text-transform:uppercase;
  color:var(--teal);margin-bottom:10px;
}
.popup-name{
  font-family:'Montserrat',sans-serif;
  font-size:22px;font-weight:700;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--text);
  line-height:1.2;margin-bottom:14px;
}
.popup-price{
  font-size:16px;font-weight:600;color:var(--teal);
  margin-bottom:14px;
}
.popup-price::before{content:'Ð ';font-size:13px}
.popup-desc{
  font-size:13px;color:var(--text-light);line-height:1.7;
  margin-bottom:20px;flex:1;
}
.popup-actions{display:flex;gap:12px;flex-wrap:wrap}
.btn-outline{
  flex:1;min-width:120px;
  border:1.5px solid var(--teal-dark);color:var(--teal-dark);
  background:transparent;
  padding:12px 16px;border-radius:40px;
  font-family:'Montserrat',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:all 0.2s;
}
.btn-outline:hover{background:var(--teal-dark);color:#fff}
.btn-solid{
  flex:1;min-width:120px;
  background:var(--teal-dark);color:#fff;border:none;
  padding:12px 16px;border-radius:40px;
  font-family:'Montserrat',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;cursor:pointer;
  transition:background 0.2s;
}
.btn-solid:hover{background:var(--teal)}

.popup-nav-btn{
  position:absolute;bottom:32px;left:40px;
  display:flex;gap:10px;z-index:2;
}
.nav-circle{
  width:36px;height:36px;border-radius:50%;
  border:1.5px solid rgba(0,0,0,0.2);
  background:rgba(255,255,255,0.8);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:14px;color:var(--text);
  transition:all 0.2s;
}
.nav-circle:hover{background:var(--teal-dark);color:#fff;border-color:var(--teal-dark)}

.popup-close{
  position:absolute;top:16px;right:16px;
  width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,0.9);border:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:16px;color:var(--text);
  z-index:5;transition:all 0.2s;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}
.popup-close:hover{background:var(--teal-dark);color:#fff}

/* ── FOOTER TICKER ── */
.ticker{
  position:relative;z-index:2;
  border-top:1px solid rgba(0,0,0,0.08);
  padding:14px 0;overflow:hidden;
  background:rgba(240,240,238,0.8);
}
.ticker-inner{
  display:flex;gap:0;white-space:nowrap;
  animation:ticker 22s linear infinite;
}
.ticker-item{
  font-size:10px;letter-spacing:3px;text-transform:uppercase;
  color:var(--teal);padding:0 28px;
  display:flex;align-items:center;gap:10px;
}
.ticker-item::after{content:'·';color:var(--gold);font-size:16px}
@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ── RESPONSIVE ── */
@media(max-width:640px){
  nav{padding:16px 20px}
  .hero{height:220px}
  .hero-label{left:20px}
  .section-head{padding:24px 20px 0}
  .section-num{font-size:72px;left:12px}
  .section-title-wrap{padding-left:56px}
  .dishes-grid{grid-template-columns:repeat(2,1fr);padding:20px 20px 36px;gap:0 16px}
  .popup{grid-template-columns:1fr;}
  .popup-img-side{padding:24px;}
  .popup-dish-img{max-width:180px}
  .popup-info{padding:24px}
}
</style>
</head>

<div class="ingredient ing-1"></div>
<div class="ingredient ing-2"></div>
<div class="ingredient ing-3"></div>
<div class="ingredient ing-4"></div>
<div class="ingredient ing-5"></div>
<div class="ingredient ing-6"></div>

let current = 0;

// Build grid
const grid = document.getElementById('dishGrid');
DISHES.forEach((d,i) => {
  const card = document.createElement('div');
  card.className = 'dish-card';
  card.innerHTML = `
    <div class="dish-img-wrap">
      ${d.tag ? `<div class="chef-badge">${d.tag}</div>` : ''}
      <img class="dish-img" src="${d.img}" alt="${d.name}" loading="lazy">
    </div>
    <div class="dish-name">${d.name}</div>
    <div class="dish-price">${d.price.replace('AED ','').replace('AED','')}</div>
  `;
  card.onclick = () => openPopup(i);
  grid.appendChild(card);
});

// Ticker
const items = ['Bar Bites','Charcoal Kitchen','Levantine Plates','Skyline Views','Dubai Al Jaddaf',
  'Signature Cocktails','Rooftop Lounge','Premium Shisha','Modern Levant'];
const t = document.getElementById('ticker');
const full = [...items,...items].map(x=>`<span class="ticker-item">${x}</span>`).join('');
t.innerHTML = full + full; // double for seamless

function openPopup(i) {
  current = i;
  const d = DISHES[i];
  document.getElementById('popupImg').src = d.img;
  document.getElementById('popupName').textContent = d.name;
  document.getElementById('popupPrice').textContent = d.price.replace('AED ','').replace('AED','');
  document.getElementById('popupDesc').textContent = d.desc;
  document.getElementById('popupCounter').textContent = `${String(i+1).padStart(2,'0')} / 06 · BAR BITES`;
  const wa = document.getElementById('waBtn');
  wa.onclick = () => window.open(`https://wa.me/971000000000?text=I%27d%20like%20to%20order%20${encodeURIComponent(d.name)}%20from%20Bar%20Bites`,'_blank');
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow='hidden';
}

function closePopup(e) {
  if(!e || e.target===document.getElementById('overlay') || e.currentTarget.className==='popup-close') {
    document.getElementById('overlay').classList.remove('open');
    document.body.style.overflow='';
  }
}

function navigate(dir) {
  current = (current + dir + DISHES.length) % DISHES.length;
  openPopup(current);
}

document.addEventListener('keydown', e => {
  if(e.key==='Escape') closePopup({});
  if(e.key==='ArrowLeft') navigate(-1);
  if(e.key==='ArrowRight') navigate(1);
});
</script>
</body>
</html>
