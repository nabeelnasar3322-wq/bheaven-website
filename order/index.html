<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F7F3EA">
<title>Order from your table | B-Heaven</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F3EA;--card:#FFFFFF;--ink:#23303A;--muted:#5E6A72;--yellow:#F4B824;--teal:#2F7F7B;--teal-d:#1F5E5B;--rust:#A4574A;--rattan:#B9834B;--palm:#4E7A3C;--line:rgba(35,48,58,.12);--red:#9B2C1F}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Montserrat',sans-serif;font-weight:400;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{padding:0 0 150px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:16px 16px 14px;border-bottom:1px solid var(--line)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:7px;background:repeating-linear-gradient(90deg,var(--yellow) 0 34px,#FFFFFF 34px 68px)}
.eyebrow{font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;font-weight:600;color:var(--teal);margin:0 0 6px}
h1{font-size:21px;margin:0;font-weight:700;line-height:1.1}
.sub{color:var(--muted);font-size:13px;margin:6px 0 0;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px}
.table{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--rust);border-radius:16px;padding:14px 16px;margin-bottom:18px;box-shadow:0 10px 24px -18px rgba(35,48,58,.35)}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:500}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#FBF9F4;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
input[type=text]:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px}
textarea{min-height:64px;resize:vertical}
h2{font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:var(--palm);margin:28px 0 10px;font-weight:700;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--yellow) 0 12px,transparent 12px 18px)}
.dish{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:10px;box-shadow:0 10px 24px -18px rgba(35,48,58,.35)}
.dish .info{min-width:0;flex:1}
.dish .n{font-weight:600;font-size:15px}
.dish .d{color:var(--muted);font-size:13px;margin-top:3px;line-height:1.4}
.dish .p{color:var(--rust);font-size:13px;font-weight:700;margin-top:6px}
.step{display:flex;align-items:center;gap:8px;flex:none}
.step button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--teal);background:#fff;color:var(--teal);font-size:21px;line-height:1;cursor:pointer;font-family:inherit}
.step button[data-d="1"]{background:var(--teal);color:#fff}
.step button:disabled{opacity:.3;cursor:default}
.step .q{min-width:24px;text-align:center;font-weight:700;font-size:16px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -12px 28px -16px rgba(35,48,58,.4)}
.bar::before{content:"";position:absolute;left:0;right:0;top:-7px;height:7px;background:repeating-linear-gradient(90deg,var(--yellow) 0 34px,#FFFFFF 34px 68px)}
.bar .in{max-width:640px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between}
.bar .tot{font-size:13px;color:var(--muted)}
.bar .tot b{color:var(--ink);font-size:17px;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--yellow);color:var(--ink);border:0;border-radius:999px;padding:15px 24px;font:inherit;font-size:.8rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;white-space:nowrap;box-shadow:0 10px 20px -12px rgba(201,143,10,.9)}
.btn:disabled{opacity:.45;cursor:default}
.msg{margin-top:12px;font-size:14px;color:var(--red)}
.done{text-align:center;padding:40px 16px}
.done h2{margin:0 0 10px;font-size:22px;letter-spacing:0;text-transform:none;color:var(--ink)}
.done h2::after{display:none}
.done p{color:var(--muted);line-height:1.5}
.hide{display:none!important}
</style>
</head>
<body>
<header>
  <h1>Order from your table</h1>
  <p class="eyebrow">Table ordering</p>
  <p class="sub">Choose your dishes and send them to the kitchen. Your waiter will bring them to you. Pay your waiter when you leave.</p>
</header>

<main class="wrap">
  <section class="table" id="tableBox">
    <label for="table">Table number</label>
    <input type="text" id="table" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="e.g. 12" aria-describedby="tableHelp">
    <p class="sub" id="tableHelp" style="margin-top:8px">Your table number is on the table card. Ask your waiter if you can't find it.</p>
  </section>

  <div id="menu" aria-live="polite"><p class="sub">Loading the menu…</p></div>

  <section class="table" style="margin-top:22px">
    <label for="note">Notes for the kitchen (allergies, changes)</label>
    <textarea id="note" maxlength="300" placeholder="e.g. no nuts, sauce on the side"></textarea>
  </section>

  <section class="done hide" id="done">
    <h2>Sent to the kitchen</h2>
    <p id="doneText"></p>
    <p><button class="btn" id="again" type="button">Order more</button></p>
  </section>
</main>

<div class="bar hide" id="bar">
  <div class="in">
    <div class="tot">Items: <span id="count">0</span><b id="total">AED 0</b></div>
    <button class="btn" id="send" type="button" disabled>Send to kitchen</button>
  </div>
</div>
<div class="wrap" style="padding-top:0"><p class="msg" id="msg" role="alert"></p></div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var cart = {};        // name -> { n, p, q }
  var menu = {};        // category -> dishes
  var sending = false;

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function price(p) { var n = parseFloat(String(p || '').replace(/[^0-9.]/g, '')); return isNaN(n) ? 0 : n; }
  function msg(t) { $('#msg').textContent = t || ''; }

  // Read the dishes from the menu page's own data, so the menu is only edited in one place.
  fetch('/menu/', { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (html) {
    var m = html.match(/^const M = (\{.*\});$/m);
    if (!m) throw new Error('no menu');
    menu = JSON.parse(m[1]);
    render();
  }).catch(function () {
    $('#menu').innerHTML = '<p class="sub">The menu could not load. Please refresh, or ask your waiter.</p>';
  });

  function render() {
    var html = '';
    Object.keys(menu).forEach(function (cat) {
      html += '<h2>' + esc(cat) + '</h2>';
      menu[cat].forEach(function (d) {
        var q = cart[d.n] ? cart[d.n].q : 0;
        html += '<div class="dish"><div class="info"><div class="n">' + esc(d.n) + '</div>' +
          (d.d ? '<div class="d">' + esc(d.d) + '</div>' : '') +
          '<div class="p">' + esc(d.p || '') + '</div></div>' +
          '<div class="step"><button type="button" data-n="' + esc(d.n) + '" data-d="-1"' + (q ? '' : ' disabled') + ' aria-label="Remove one ' + esc(d.n) + '">−</button>' +
          '<span class="q" aria-live="polite">' + q + '</span>' +
          '<button type="button" data-n="' + esc(d.n) + '" data-d="1" aria-label="Add one ' + esc(d.n) + '">+</button></div></div>';
      });
    });
    $('#menu').innerHTML = html;
    updateBar();
  }

  $('#menu').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-n]');
    if (!b) return;
    var name = b.getAttribute('data-n');
    var delta = parseInt(b.getAttribute('data-d'), 10);
    var dish = null;
    Object.keys(menu).forEach(function (cat) { menu[cat].forEach(function (d) { if (d.n === name) dish = d; }); });
    if (!dish) return;
    var cur = cart[name] ? cart[name].q : 0;
    var next = Math.min(20, Math.max(0, cur + delta));
    if (next === 0) delete cart[name];
    else cart[name] = { n: name, p: price(dish.p), q: next };
    msg('');
    render();
  });

  function updateBar() {
    var count = 0, total = 0;
    Object.keys(cart).forEach(function (k) { count += cart[k].q; total += cart[k].q * cart[k].p; });
    $('#count').textContent = count;
    $('#total').textContent = 'AED ' + total.toFixed(0);
    $('#bar').classList.toggle('hide', count === 0);
    $('#send').disabled = count === 0 || sending;
  }

  $('#table').value = (function () { try { return localStorage.getItem('bh_table') || ''; } catch (e) { return ''; } })();
  $('#table').addEventListener('input', function () {
    this.value = this.value.toUpperCase().replace(/[^A-Z0-9-]/g, '');
    try { localStorage.setItem('bh_table', this.value); } catch (e) {}
  });

  $('#send').addEventListener('click', function () {
    var table = $('#table').value.trim();
    if (!/^[A-Z0-9-]{1,6}$/.test(table)) { msg('Please enter your table number first.'); $('#table').focus(); return; }
    var items = Object.keys(cart).map(function (k) { return { n: cart[k].n, q: cart[k].q }; });
    sending = true; updateBar(); msg('');
    fetch('/api/orders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      cache: 'no-store',
      body: JSON.stringify({ action: 'create', table: table, items: items, note: $('#note').value.trim() })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, j: j }; });
    }).then(function (res) {
      if (!res.ok) throw new Error(res.j.error || 'Could not send. Please ask your waiter.');
      cart = {}; $('#note').value = '';
      render();
      $('#doneText').textContent = 'Table ' + res.j.table + ' — your waiter has your order and will bring it to you.';
      $('#done').classList.remove('hide');
      $('#menu').classList.add('hide'); $('#tableBox').classList.add('hide');
      $('#bar').classList.add('hide');
      window.scrollTo(0, 0);
    }).catch(function (err) {
      msg(err.message || 'Could not send. Please ask your waiter.');
    }).then(function () { sending = false; updateBar(); });
  });

  $('#again').addEventListener('click', function () {
    $('#done').classList.add('hide'); $('#menu').classList.remove('hide'); $('#tableBox').classList.remove('hide');
    render();
  });
})();
</script>
</body>
</html>
