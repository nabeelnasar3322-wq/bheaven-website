<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1E474C">
<title>Offline · B-Heaven by Barceló</title>
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:32px 24px;background:#1E474C;color:#ECECE9;font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
  main{max-width:360px}
  img{width:132px;height:auto;border-radius:28px;margin:0 auto 28px;display:block}
  h1{font-weight:300;font-size:1.6rem;letter-spacing:.02em;margin:0 0 10px}
  p{margin:0 0 26px;line-height:1.6;color:rgba(236,236,233,.78);font-size:.95rem}
  a.btn,button{display:inline-block;font:inherit;font-size:.74rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:#1E474C;background:#EADFCB;border:0;border-radius:999px;padding:14px 26px;cursor:pointer}
  .contact{margin-top:30px;font-size:.8rem;color:rgba(236,236,233,.7)}
  .contact a{color:#EADFCB;text-decoration:none}
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" width="132" height="132" alt="B-Heaven by Barceló">
  <h1>You&rsquo;re offline</h1>
  <p>The menu pages you&rsquo;ve already opened stay available. Check your connection to see the rest, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
  <p class="contact">Table bookings: <a href="tel:+971506129150">+971 50 612 9150</a></p>
</main>
</body>
</html>
