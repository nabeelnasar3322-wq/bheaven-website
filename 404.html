<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page not found · B-Heaven by Barceló</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#ECECE9;--ink:#1F2A33;--muted:#6C757C;--teal-d:#3E7479;--teal-deep:#1E474C}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font-family:'Montserrat',sans-serif;-webkit-font-smoothing:antialiased;text-align:center}
main{max-width:460px}
.eyebrow{font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;font-weight:600;color:var(--teal-d)}
h1{font-weight:600;font-size:clamp(2rem,6vw,2.8rem);line-height:1.05;margin:14px 0 12px}
p{color:var(--muted);line-height:1.6;margin:0 0 28px}
a.btn{display:inline-block;background:var(--teal-deep);color:#fff;padding:15px 28px;border-radius:999px;font-size:.78rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;text-decoration:none}
a.btn:hover{background:var(--ink)}
a.btn:focus-visible{outline:2px solid var(--teal-d);outline-offset:4px}
</style>
</head>
<body>
<main>
  <div class="eyebrow">Error 404</div>
  <h1>This page is off the menu</h1>
  <p>The page you are looking for does not exist or has moved. Let us take you back to the rooftop.</p>
  <a class="btn" href="/menu/">Explore the menu</a>
</main>
</body>
</html>
