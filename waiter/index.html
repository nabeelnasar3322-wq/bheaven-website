<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ECECE9">
<title>Waiter order | B-Heaven</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ECECE9;--tile:#F5F5F3;--ink:#1F2A33;--muted:#5B656C;--teal-d:#376C71;--teal-deep:#1E474C;--gold:#B08D57;--gold-t:#80622F;--line:rgba(31,42,51,.12);--alarm:#B3261E;--yellow:#F4B824}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Montserrat',sans-serif;font-weight:400;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{padding:0 0 130px}
header{position:sticky;top:0;z-index:5;background:rgba(236,236,233,.97);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:18px;margin:0;font-weight:600}
.link{border:1.5px solid var(--teal-deep);background:transparent;color:var(--teal-deep);border-radius:999px;padding:7px 14px;font:inherit;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:500;cursor:pointer;text-decoration:none}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--tile);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:16px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:500}
input[type=text],input[type=password],textarea{width:100%;font:inherit;font-size:18px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
input[type=text]:focus,textarea:focus{outline:2px solid var(--teal-d);outline-offset:1px}
textarea{min-height:60px;resize:vertical;font-size:16px}
.seats-hint{font-size:13px;color:var(--muted);text-align:center;margin:0 0 4px}
/* Table and chairs: same colours and sizes as the guest page (/order/) */
.seats{background:#FFFFFF;border:1px solid var(--line);border-radius:16px;padding:14px 12px 10px;box-shadow:0 10px 24px -18px rgba(35,48,58,.35);margin-top:12px}
.ring{position:relative;width:100%;max-width:290px;aspect-ratio:1;margin:4px auto 2px}
.top{position:absolute;left:50%;top:50%;width:44%;height:44%;transform:translate(-50%,-50%);border-radius:50%;background:#FBF9F4;border:2px solid #A4574A;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:inset 0 0 0 6px #fff}
.top b{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#A4574A}
.top span{font-size:11px;color:#5E6A72;margin-top:2px}
.chair{position:absolute;width:46px;height:46px;transform:translate(-50%,-50%);border-radius:50%;border:1.5px solid #2F7F7B;background:#fff;color:#2F7F7B;font:inherit;font-weight:700;font-size:13px;cursor:pointer;padding:0}
.chair[aria-pressed=true]{background:#2F7F7B;color:#fff;box-shadow:0 0 0 4px rgba(47,127,123,.22)}
.chair .badge{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;border-radius:10px;background:#F4B824;color:#23303A;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.chair .badge[hidden]{display:none}
.for{font-size:15px;background:#E3ECEB;border-radius:12px;padding:10px 12px;margin:14px 0 4px}
.for b{color:var(--teal-deep)}
h2{font-size:.72rem;letter-spacing:.26em;text-transform:uppercase;color:var(--gold-t);margin:22px 0 8px;font-weight:700}
.dish{display:flex;gap:12px;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.dish .info{min-width:0;flex:1}
.dish .n{font-weight:600;font-size:15px}
.dish .d{color:var(--muted);font-size:13px;margin-top:3px;line-height:1.4}
.dish .p{color:var(--gold-t);font-size:13px;font-weight:700;margin-top:5px}
.step{display:flex;align-items:center;gap:8px;flex:none}
.step button{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--teal-d);background:#fff;color:var(--teal-d);font-size:22px;line-height:1;cursor:pointer;font-family:inherit}
.step button[data-d="1"]{background:var(--teal-deep);border-color:var(--teal-deep);color:#fff}
.step button:disabled{opacity:.3;cursor:default}
.step .q{min-width:24px;text-align:center;font-weight:700;font-size:17px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.cat{text-align:left;font:inherit;background:var(--tile);border:1px solid var(--line);border-left:4px solid var(--yellow);border-radius:14px;padding:14px 14px 13px;cursor:pointer;min-height:78px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.cat .cn{font-weight:700;font-size:14px;letter-spacing:.04em;color:var(--ink);text-transform:uppercase}
.cat .cc{font-size:12px;color:var(--muted)}
.cat .cc b{color:var(--teal-deep);font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(31,42,51,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet-card{background:var(--bg);width:100%;max-width:640px;max-height:88vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;box-shadow:0 -20px 40px -20px rgba(31,42,51,.5)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.sheet-head h3{margin:0;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-t)}
.sheet-x{border:1px solid var(--line);background:var(--tile);border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.sheet-body{overflow-y:auto;padding:12px 16px 8px;-webkit-overflow-scrolling:touch}
.sheet-foot{padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--tile)}
.sheet-foot .btn{width:100%}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--tile);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -12px 28px -16px rgba(31,42,51,.35)}
.bar .in{max-width:640px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between}
.bar .tot{font-size:13px;color:var(--muted)}
.bar .tot b{color:var(--ink);font-size:17px;display:block}
.btn{border:0;border-radius:999px;background:var(--teal-deep);color:#fff;font:inherit;font-weight:600;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;padding:15px 22px;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:default}
#msg{color:var(--alarm);font-size:14px;min-height:20px;margin:10px 0 0}
#ok{color:#2E7D5B;font-size:14px;font-weight:600;min-height:20px;margin:10px 0 0}
#lock{max-width:340px;margin:12vh auto 0;padding:0 16px}
#lock form{display:flex;flex-direction:column;gap:12px}
#lock input{font:inherit;font-size:20px;letter-spacing:4px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
#lock button{font:inherit;font-weight:500;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;background:var(--teal-deep);color:#fff;border:0;border-radius:999px;padding:15px;cursor:pointer}
#lock p{color:var(--muted);font-size:14px;text-align:center;margin:0}
.top.busy b,.top.busy span{display:none}
.plates{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;grid-template-columns:repeat(2,44px);gap:6px;justify-content:center;pointer-events:none;z-index:2}
.plate{position:relative;width:44px;height:44px;border-radius:50%;background:#fff;border:2px solid #F4B824;box-shadow:0 2px 4px rgba(0,0,0,.22);display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;padding:4px}
.plate.sent{border-color:#2F7F7B}
.plate.more{font-size:10px;font-weight:700;color:#fff;background:#A4574A;border-color:#fff;border-radius:50%}
.plate .pn{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:8.5px;line-height:1.15;color:#23303A;font-weight:600}
.plate .qty{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:#F4B824;color:#23303A;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.plate.sent .qty{background:#2F7F7B;color:#fff}
.clear-btn{background:none;border:0;color:#A4574A;font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:6px}
.clear-btn[hidden]{display:none}
.hide{display:none!important}

/* Table and chairs from the reference photo: rose-brown round table, teal leather chairs with the backs facing outward */
.top{background:radial-gradient(circle at 42% 36%,#B9766A 0%,#A4574A 55%,#8C4A40 100%)!important;border:0!important;box-shadow:0 8px 18px -8px rgba(60,30,25,.55),inset 0 0 0 5px rgba(255,255,255,.12)!important}
.top b{color:#FBEFE9!important}
.top span{color:#F6DED6!important}
.chair{width:50px;height:44px;border-radius:25px 25px 16px 16px;border:1.5px solid #1F6B67;background:linear-gradient(180deg,#3D9F97 0%,#2F8C84 55%,#257A74 100%);box-shadow:inset 0 5px 6px -2px rgba(255,255,255,.28),0 4px 8px -3px rgba(0,0,0,.35);transform:translate(-50%,-50%) rotate(var(--a,0deg))}

/* Three chairs, each with a tropical leaf cushion */
.sofa{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.chair{width:62px;height:54px;border-radius:31px 31px 18px 18px}
.cush{position:absolute;left:50%;bottom:4px;width:76%;height:56%;transform:translateX(-50%);border-radius:12px;background:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2736%27 height=%2736%27 viewBox=%270 0 36 36%27%3E%3Crect width=%2736%27 height=%2736%27 fill=%27%23F3EBD3%27/%3E%3Cpath d=%27M18 4 C27 11 28 24 18 32 C8 24 9 11 18 4Z%27 fill=%27%234E7A3C%27/%3E%3Cpath d=%27M18 6 V30%27 stroke=%27%23F3EBD3%27 stroke-width=%271.2%27/%3E%3Cpath d=%27M0 18 C6 12 10 12 12 18 C10 24 6 24 0 18Z%27 fill=%27%237FA34A%27/%3E%3Cpath d=%27M36 18 C30 12 26 12 24 18 C26 24 30 24 36 18Z%27 fill=%27%237FA34A%27/%3E%3C/svg%3E") center/36px 36px;border:1px solid #1F6B67;box-shadow:inset 0 2px 3px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div id="lock" class="hide">
  <form id="pinForm">
    <h1 style="text-align:center">Waiter sign in</h1>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" aria-label="Staff PIN" required>
    <button type="submit">Open</button>
    <p id="lockMsg"></p>
  </form>
</div>

<div id="app" class="hide">
  <header>
    <h1>Waiter order</h1>
    <a class="link" href="/staff/">Kitchen and floor</a>
  </header>

  <main class="wrap">
    <section class="card">
      <label for="table">Table number</label>
      <input type="text" id="table" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="e.g. 12">
    </section>
    <section class="seats" aria-label="Table seats">
      <div class="ring" id="ring"></div>
      <p class="seats-hint"><button type="button" id="clearTable" class="clear-btn" hidden>Clear this table</button></p>
    </section>

    <div id="menu" aria-live="polite"><p class="seats-hint">Loading the menu…</p></div>

    <section class="card" style="margin-top:18px">
      <label for="note">Notes for the kitchen</label>
      <textarea id="note" maxlength="300" placeholder="e.g. no nuts, sauce on the side"></textarea>
    </section>

    <p id="msg" role="alert"></p>
    <p id="ok" role="status"></p>
  </main>
</div>

<div class="sheet hide" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-card">
    <div class="sheet-head"><h3 id="sheetTitle"></h3><button type="button" class="sheet-x" id="sheetClose">Close</button></div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot"><button type="button" class="btn" id="sheetDone">Done</button></div>
  </div>
</div>

<div class="bar hide" id="bar">
  <div class="in">
    <div class="tot">Items: <span id="count">0</span><b id="total">AED 0</b></div>
    <button class="btn" id="send" type="button" disabled>Send to kitchen</button>
  </div>
</div>

<script>
(function () {
  var KEY = 'bh_staff_pin';
  var pin = '';
  try { pin = sessionStorage.getItem(KEY) || ''; } catch (e) {}
  var $ = function (s) { return document.querySelector(s); };
  var SEATS = 3;
  var cart = {};   // seat (1-8) -> { dish name -> { n, p, q } }
  var seat = 0;
  var menu = {};
  var sending = false;

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function price(p) { var n = parseFloat(String(p || '').replace(/[^0-9.]/g, '')); return isNaN(n) ? 0 : n; }
  function msg(t) { $('#msg').textContent = t || ''; $('#ok').textContent = ''; }
  function okMsg(t) { $('#ok').textContent = t || ''; $('#msg').textContent = ''; }
  function seatCount(s) { var c = cart[s] || {}; return Object.keys(c).reduce(function (a, k) { return a + c[k].q; }, 0); }

  // Dishes sent for each table stay on the table until the waiter clears it (kept for this browser session)
  function loadSent() { try { return JSON.parse(sessionStorage.getItem('bh_sent') || '{}') || {}; } catch (e) { return {}; } }
  var sent = loadSent();
  function saveSent() { try { sessionStorage.setItem('bh_sent', JSON.stringify(sent)); } catch (e) {} }
  function tableKey() { return $('#table').value.trim(); }
  // Everything still in the cart, across all seats, by dish name
  function pendingTotals() {
    var out = {};
    Object.keys(cart).forEach(function (s) {
      Object.keys(cart[s]).forEach(function (k) {
        var c = cart[s][k], e = out[k] || { n: c.n, q: 0 };
        e.q += c.q; out[k] = e;
      });
    });
    return out;
  }
  // Plates on the table: unsent dishes first (yellow), then dishes already sent (teal)
  function plateList() {
    var list = [], pend = pendingTotals(), st = sent[tableKey()] || {};
    Object.keys(pend).forEach(function (k) { list.push({ n: pend[k].n, q: pend[k].q, sent: false }); });
    Object.keys(st).forEach(function (k) { list.push({ n: st[k].n, q: st[k].q, sent: true }); });
    return list;
  }

  function showLock(text) {
    $('#app').classList.add('hide');
    $('#bar').classList.add('hide');
    $('#lock').classList.remove('hide');
    $('#lockMsg').textContent = text || '';
    $('#pin').value = '';
    $('#pin').focus();
  }

  // Check the PIN against the staff API before opening the order screen.
  function unlock() {
    fetch('/api/orders', { headers: { 'x-staff-pin': pin }, cache: 'no-store' }).then(function (r) {
      if (r.status === 401 || r.status === 429) {
        pin = ''; try { sessionStorage.removeItem(KEY); } catch (e) {}
        return r.json().catch(function () { return {}; }).then(function (j) { showLock(j.error || 'Wrong PIN'); });
      }
      $('#lock').classList.add('hide');
      $('#app').classList.remove('hide');
      loadMenu();
      renderAll();
    }).catch(function () { showLock('Connection lost. Try again.'); });
  }

  $('#pinForm').addEventListener('submit', function (e) {
    e.preventDefault();
    pin = $('#pin').value.trim();
    if (!pin) return;
    try { sessionStorage.setItem(KEY, pin); } catch (err) {}
    unlock();
  });

  function loadMenu() {
    if (Object.keys(menu).length) return;
    fetch('/menu/', { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (html) {
      var m = html.match(/^const M = (\{.*\});$/m);
      if (!m) throw new Error('no menu');
      menu = JSON.parse(m[1]);
      renderAll();
    }).catch(function () {
      $('#menu').innerHTML = '<p class="seats-hint">The menu could not load. Refresh the page.</p>';
    });
  }

  function renderRing() {
    var list = plateList();
    // Curved tropical sofa wrapping the upper-left of the table (decorative, sits in the gap between chairs)
    var html = '<svg class="sofa" viewBox="0 0 100 100" aria-hidden="true"><defs><pattern id="lf" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#F3EBD3"/><path d="M6 1.3C9 3.7 9.3 8 6 10.7C2.7 8 3 3.7 6 1.3Z" fill="#4E7A3C"/><path d="M0 6C2 4 3.3 4 4 6C3.3 8 2 8 0 6Z" fill="#7FA34A"/><path d="M12 6C10 4 8.7 4 8 6C8.7 8 10 8 12 6Z" fill="#7FA34A"/></pattern></defs><path d="M4.45 56.4A46 46 0 0 1 34.27 6.77L41.79 27.45A24 24 0 0 0 26.24 53.35Z" fill="url(#lf)" stroke="#B9763C" stroke-width="2.2" stroke-linejoin="round"/></svg>';
    html += '<div class="top' + (list.length ? ' busy' : '') + '"><b>Table</b><span id="tnum"></span></div>';
    for (var s = 1; s <= SEATS; s++) {
      var a = (s - 1) * 360 / SEATS * Math.PI / 180;
      var x = 50 + 40 * Math.sin(a), y = 50 - 40 * Math.cos(a);
      html += '<span class="chair" aria-hidden="true" style="left:' + x.toFixed(2) + '%;top:' + y.toFixed(2) + '%;--a:' + (s - 1) * 360 / SEATS + 'deg"><i class="cush"></i></span>';
    }
    if (list.length) {
      var shown = list.slice(0, 6), extra = list.length - shown.length;
      html += '<div class="plates">' + shown.map(function (p) {
        return '<span class="plate' + (p.sent ? ' sent' : '') + '" title="' + esc(p.n) + '"><span class="pn">' + esc(p.n) + '</span><b class="qty">' + p.q + '</b></span>';
      }).join('') + (extra > 0 ? '<span class="plate more">+' + extra + ' more</span>' : '') + '</div>';
    }
    $('#ring').innerHTML = html;
    $('#tnum').textContent = $('#table').value || '';
    var st = sent[tableKey()] || {};
    $('#clearTable').hidden = !Object.keys(st).length;
  }

  var openCat = -1;
  function dishHtml(d) {
    var mine = cart[seat] || {};
    var q = mine[d.n] ? mine[d.n].q : 0;
    return '<div class="dish"><div class="info"><div class="n">' + esc(d.n) + '</div>' +
      (d.d ? '<div class="d">' + esc(d.d) + '</div>' : '') +
      '<div class="p">' + esc(d.p || '') + '</div></div>' +
      '<div class="step"><button type="button" data-n="' + esc(d.n) + '" data-d="-1"' + (q ? '' : ' disabled') + ' aria-label="Remove one ' + esc(d.n) + '">−</button>' +
      '<span class="q" aria-live="polite">' + q + '</span>' +
      '<button type="button" data-n="' + esc(d.n) + '" data-d="1" aria-label="Add one ' + esc(d.n) + '">+</button></div></div>';
  }
  function renderSheet() {
    var cats = Object.keys(menu);
    if (openCat < 0 || !cats[openCat]) return;
    $('#sheetTitle').textContent = cats[openCat];
    $('#sheetBody').innerHTML = menu[cats[openCat]].map(dishHtml).join('');
  }
  function openSheet(i) { openCat = i; renderSheet(); $('#sheetBody').scrollTop = 0; $('#sheet').classList.remove('hide'); }
  function closeSheet() { openCat = -1; $('#sheet').classList.add('hide'); }

  function renderMenu() {
    var mine = cart[seat] || {};
    var cats = Object.keys(menu);
    $('#menu').innerHTML = '<div class="cats">' + cats.map(function (cat, i) {
      var n = 0;
      menu[cat].forEach(function (d) { if (mine[d.n]) n += mine[d.n].q; });
      return '<button type="button" class="cat" data-cat="' + i + '"><span class="cn">' + esc(cat) + '</span><span class="cc">' +
        menu[cat].length + ' dishes' + (n ? ' · <b>' + n + ' chosen</b>' : '') + '</span></button>';
    }).join('') + '</div>';
    renderSheet();
  }

  function updateBar() {
    var count = 0, total = 0;
    Object.keys(cart).forEach(function (s) {
      Object.keys(cart[s]).forEach(function (k) { count += cart[s][k].q; total += cart[s][k].q * cart[s][k].p; });
    });
    $('#count').textContent = count;
    $('#total').textContent = 'AED ' + total.toFixed(0);
    $('#bar').classList.toggle('hide', count === 0);
    $('#send').disabled = count === 0 || sending;
  }

  function renderAll() {
    renderRing();
    renderMenu();
    updateBar();
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-cat]');
    if (t && t.closest('#menu')) { openSheet(parseInt(t.getAttribute('data-cat'), 10)); return; }
    if (e.target.closest('#sheetClose, #sheetDone') || e.target.id === 'sheet') { closeSheet(); return; }
    var b = e.target.closest('button[data-n]');
    if (!b) return;
    var name = b.getAttribute('data-n');
    var delta = parseInt(b.getAttribute('data-d'), 10);
    var dish = null;
    Object.keys(menu).forEach(function (cat) { menu[cat].forEach(function (d) { if (d.n === name) dish = d; }); });
    if (!dish) return;
    var mine = cart[seat] || (cart[seat] = {});
    var cur = mine[name] ? mine[name].q : 0;
    var next = Math.min(20, Math.max(0, cur + delta));
    if (next === 0) delete mine[name];
    else mine[name] = { n: name, p: price(dish.p), q: next };
    if (!Object.keys(mine).length) delete cart[seat];
    msg('');
    renderAll();
  });

  $('#table').value = (function () { try { return localStorage.getItem('bh_table') || ''; } catch (e) { return ''; } })();
  $('#table').addEventListener('input', function () {
    this.value = this.value.toUpperCase().replace(/[^A-Z0-9-]/g, '');
    try { localStorage.setItem('bh_table', this.value); } catch (e) {}
    renderRing();
  });

  $('#send').addEventListener('click', function () {
    var table = $('#table').value.trim();
    if (!/^[A-Z0-9-]{1,6}$/.test(table)) { msg('Enter the table number first.'); $('#table').focus(); return; }
    var items = [];
    Object.keys(cart).forEach(function (s) {
      Object.keys(cart[s]).forEach(function (k) { items.push({ n: cart[s][k].n, q: cart[s][k].q, s: parseInt(s, 10) }); });
    });
    sending = true; updateBar(); msg('');
    fetch('/api/orders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-staff-pin': pin },
      cache: 'no-store',
      body: JSON.stringify({ action: 'create', table: table, items: items, note: $('#note').value.trim() })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, ok: r.ok, j: j }; });
    }).then(function (res) {
      if (res.status === 401) { showLock('Wrong PIN'); return; }
      if (!res.ok) throw new Error(res.j.error || 'Could not send. Try again.');
      var key = table;
      sent[key] = sent[key] || {};
      items.forEach(function (i) {
        var e = sent[key][i.n] || { n: i.n, q: 0 };
        e.q += i.q; sent[key][i.n] = e;
      });
      saveSent();
      cart = {}; seat = 0; $('#note').value = '';
      renderAll();
      okMsg('Table ' + res.j.table + ' sent to the kitchen.');
    }).catch(function (err) {
      msg(err.message || 'Could not send. Try again.');
    }).then(function () { sending = false; updateBar(); });
  });

  $('#clearTable').addEventListener('click', function () {
    delete sent[tableKey()];
    saveSent();
    renderAll();
  });

  if (pin) unlock(); else showLock('');
})();
</script>
</body>
</html>
