<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Thank you · B-Heaven by Barceló</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;600&display=swap" rel="stylesheet">
<script src="/consent.js" data-ga="G-5EP0X5NXPJ" defer></script>
<style>
:root{--bg:#ECECE9;--ink:#1F2A33;--muted:#4F5A61;--teal-d:#3E7479;--teal-deep:#1E474C}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font-family:'Montserrat',system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-align:center}
main{max-width:480px}
.eyebrow{font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;font-weight:600;color:var(--teal-d)}
h1{font-weight:600;font-size:clamp(2rem,6vw,2.8rem);line-height:1.1;margin:14px 0 12px}
p{color:var(--muted);line-height:1.6;margin:0 0 14px}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:26px}
a.btn{display:inline-block;padding:15px 26px;border-radius:999px;font-size:.78rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;text-decoration:none}
a.btn-dark{background:var(--teal-deep);color:#fff}
a.btn-line{border:1px solid var(--teal-deep);color:var(--teal-deep)}
a.btn:focus-visible{outline:2px solid var(--teal-d);outline-offset:4px}
</style>
</head>
<body>
<main>
  <div class="eyebrow">Request received</div>
  <h1>Thank you</h1>
  <p>Your table request has been opened in WhatsApp. If it did not open, you can message us directly on <a href="https://wa.me/971506129150">+971 50 612 9150</a>.</p>
  <p>Our team confirms every table on WhatsApp. Please keep an eye on your messages.</p>
  <div class="actions">
    <a class="btn btn-dark" href="/menu/">See the menu</a>
    <a class="btn btn-line" href="/">Back to the homepage</a>
  </div>
</main>
</body>
</html>
